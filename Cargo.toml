[package]
name = "fractal-explorer"
version = "0.1.0"
edition = "2021"
description = "Rust fractal renderer prototype"
license = "MIT"

[dependencies]
minifb = "0.27"
arboard = "3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[lib]
name = "fractal_explorer"
path = "src/lib.rs"

[[bin]]
name = "sprite-demo"
path = "src/main.rs"
