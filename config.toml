# Configuração principal do FractalExplorer.
debug_global = true

[renderer]
width = 800
height = 600
max_iterations = 10000
allocation_ratio = 1
deallocation_ratio = 1
max_apparent_pixel_size_exponent = 3
min_apparent_pixel_size = 0.8
zoom_multiplier = 1.3
#palette = "shade"
palette_period = 50.0
starting_point = "x=-1.50, y=0.0"

[renderer.debug]
reduced_viewport = false
reduced_viewport_allocation_ratio = 0.7
show_allocation_envelope = true

[orchestrator]
workers = 8

[orchestrator.tile]
width = 30
height = 20
