# Configuração principal do FractalExplorer.
debug_global = true

[renderer]
width = 1400
height = 800
max_iterations = 256
precision = 1
allocation_ratio = 1
deallocation_ratio = 1
max_apparent_pixel_size_exponent = 3
min_apparent_pixel_size = 1
zoom_multiplier = 2.0
rendering_method = "multiprecision"
rendering_method = "direct"
precision_technique = "fixed"
precision_level = 2
perturbation_fallback = false
#palette = "shade"
palette_period = 150.0
starting_point = "x: -1.500000000000000   y: 0.000000000000000   zoom: 3.000000000000000"

[renderer.debug]
reduced_viewport = false
reduced_viewport_allocation_ratio = 0.7
show_allocation_envelope = true
text_overlay_global = false
text_overlay_workers = false
text_overlay_layers = false
text_overlay_queue = false
middle_click_coordinate_report = false

[orchestrator]
workers = 8

[orchestrator.tile]
width = 64
height = 64
