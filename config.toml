# Configuração principal do FractalExplorer.
debug_global = true

[renderer]
width = 800
height = 600
max_iterations = 10000
allocation_ratio = 1
deallocation_ratio = 0.8
zoom_multiplier = 1.1
#palette = "shade"
palette_period = 50.0
starting_point = "x=-1.50, y=0.0"

[renderer.debug]
reduced_viewport = true
reduced_viewport_allocation_ratio = 0.7
show_allocation_envelope = true

[orchestrator.tile]
width = 200
height = 150
